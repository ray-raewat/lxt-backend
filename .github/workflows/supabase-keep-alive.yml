name: Keep Supabase Project Active

on:
  schedule:
    - cron: '0 1 * * *'   # 08:00 Thailand time (UTC+7)
    - cron: '0 13 * * *'  # 20:00 Thailand time (UTC+7)
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase directly
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://woicdagfrkmtxhmqteyy.supabase.co/rest/v1/" \
            --max-time 15)
          echo "Supabase HTTP: $CODE"
          if [ "$CODE" -ge 500 ]; then
            echo "ERROR: Supabase returned $CODE — project may be paused"
            exit 1
          fi
          echo "OK: Supabase active (HTTP $CODE)"

      - name: Ping Render backend (wake up if sleeping)
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://lxt-backend.onrender.com/ping" \
            --max-time 60) || true
          echo "Render HTTP: ${CODE:-timeout}"
          echo "Note: timeout is normal when Render is sleeping"
